# Prueba el instalador en un Windows limpio, como en la PC de un cliente: baja solo instalar.ps1, lo corre como
# administrador con Windows PowerShell 5.1, revisa que Morfi quede andando y arrancando solo, simula un reinicio y lo
# vuelve a correr (no tiene que romper ni pisar nada). Corre a mano, cuando cambia el instalador y los lunes.
name: Instalador (Windows limpio)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
  push:
    paths:
      - 'scripts/windows/**'
      - 'iniciar-morfi.bat'
      - 'ecosystem.config.js'
      - '.github/workflows/instalador-windows.yml'

jobs:
  instalar:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Node como en una PC real: para toda la máquina (la tarea de inicio corre como SYSTEM y lo busca en el PATH)
      - name: Node.js 22 para toda la PC
        shell: pwsh
        run: |
          choco install nodejs-lts --version=22.12.0 -y --no-progress --force
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          node -v

      - name: Bajar solo el instalador (como en la PC del cliente)
        shell: pwsh
        run: Invoke-WebRequest "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/windows/instalar.ps1" -OutFile "$env:RUNNER_TEMP\instalar.ps1"

      - name: Instalar
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          powershell -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\instalar.ps1" -Cliente prueba-ci -Repo "https://github.com/${{ github.repository }}.git"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Quedó todo andando
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $s = Invoke-RestMethod http://127.0.0.1:3000/api/salud -SkipHttpErrorCheck
          "salud: $($s | ConvertTo-Json -Compress)"
          if ($s.base -ne 'ok') { throw 'la base no responde' }
          $login = Invoke-RestMethod -Method Post http://127.0.0.1:3000/api/auth/login -ContentType 'application/json' -Body '{"email":"admin@morfi.local","password":"admin123"}'
          if (-not $login.token) { throw 'no se pudo iniciar sesión con el administrador inicial' }
          if (-not (Get-ScheduledTask -TaskName 'Morfi')) { throw 'falta la tarea de inicio' }
          if (-not (Get-NetFirewallRule -DisplayName 'Morfi')) { throw 'falta la regla del firewall' }
          $pm2Home = [Environment]::GetEnvironmentVariable('PM2_HOME', 'Machine'); "PM2_HOME=$pm2Home"
          if (-not $pm2Home) { throw 'falta PM2_HOME' }
          if (-not (Select-String -Path C:\Morfi\.env -Pattern '^BACKUP_CLAVE=[0-9a-f]{64}$' -Quiet)) { throw 'falta la clave de las copias' }
          if (-not (Test-Path C:\Morfi\data\morfi.db)) { throw 'falta la base' }
          (Select-String -Path C:\Morfi\.env -Pattern '^BACKUP_CLAVE=').Line | Set-Content "$env:RUNNER_TEMP\clave.txt"

      - name: Simular un reinicio de la PC (pm2 detenido, arranca la tarea de inicio)
        shell: pwsh
        run: |
          $env:PM2_HOME = [Environment]::GetEnvironmentVariable('PM2_HOME', 'Machine')
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          pm2 kill
          Start-Sleep 3
          Start-ScheduledTask -TaskName 'Morfi'
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { Start-Sleep 3; try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/api/salud -SkipHttpErrorCheck).StatusCode -gt 0 } catch {} }
          if (-not $ok) { Get-Content C:\Morfi\logs\pm2-error.log -Tail 40 -ErrorAction SilentlyContinue; throw 'después del reinicio Morfi no volvió solo' }
          'volvió solo después del reinicio'

      - name: Volver a correr el instalador (no rompe ni pisa nada)
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          powershell -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\instalar.ps1" -Cliente prueba-ci -Repo "https://github.com/${{ github.repository }}.git"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $antes = Get-Content "$env:RUNNER_TEMP\clave.txt"
          $ahora = (Select-String -Path C:\Morfi\.env -Pattern '^BACKUP_CLAVE=').Line
          if ($antes -ne $ahora) { throw 'la segunda instalación cambió la clave de las copias' }
          'segunda instalación sin cambios'

      - name: Registros si algo falló
        if: failure()
        shell: pwsh
        run: |
          Get-Content C:\Morfi\logs\pm2-error.log -Tail 60 -ErrorAction SilentlyContinue
          Get-Content C:\Morfi\logs\pm2-out.log -Tail 30 -ErrorAction SilentlyContinue
          Get-ScheduledTaskInfo -TaskName 'Morfi' -ErrorAction SilentlyContinue | Format-List
